<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}PTracker{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <nav class="navbar">
      <a class="navbar-brand" href="{{ url_for('index') }}"><span class="brand-icon"><img src="{{ url_for('static', filename='favicon.svg') }}" alt="" width="30" height="30"></span>PTracker</a>
      <ul class="nav-links">
        <li>
          <a
            href="{{ url_for('periods.list_periods') }}"
            class="{{ 'active' if request.blueprint == 'periods' else '' }}"
            >Periods</a
          >
        </li>
        <li>
          <a
            href="{{ url_for('vestot.calculate') }}"
            class="{{ 'active' if request.blueprint == 'vestot' else '' }}"
            >Vestot</a
          >
        </li>
        <li>
          <a
            href="{{ url_for('calendar.index') }}"
            class="{{ 'active' if request.blueprint == 'calendar' else '' }}"
            >Calendar</a
          >
        </li>
        <li>
          <a
            href="{{ url_for('settings.index') }}"
            class="{{ 'active' if request.blueprint == 'settings' else '' }}"
            >Settings</a
          >
        </li>
      </ul>
    </nav>

    <main class="container">
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %}
      <div class="flash-messages">
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
      {% endif %} {% endwith %} {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
